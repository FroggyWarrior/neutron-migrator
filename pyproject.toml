[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-migrator"
version = "1.0.3"
description = "Download or delete all your Proton Drive photos. By FroggyWarrior."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "requests>=2.31", "keyring>=24", "platformdirs>=4"]

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
neutron-migrator = "neutron_migrator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neutron_migrator = ["assets/i18n/*.json", "assets/themes/*"]