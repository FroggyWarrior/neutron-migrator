name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   tag: windows-x64,   cli: windows-x64 }
          - { os: windows-11-arm,   tag: windows-arm64, cli: windows-arm64 }
          - { os: ubuntu-22.04,     tag: linux-x64,     cli: linux-x64 }
          - { os: ubuntu-24.04-arm, tag: linux-arm64,   cli: linux-arm64 }
          - { os: macos-latest,     tag: macos-arm64,   cli: darwin-arm64 }
          - { os: macos-15-intel,   tag: macos-x64,     cli: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Fetch Proton Drive CLI
        run: python scripts/fetch_proton_cli.py --target ${{ matrix.cli }}
      - name: Build
        run: python scripts/build.py
      - name: AppImage
        if: startsWith(matrix.tag, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y file desktop-file-utils appstream
          bash scripts/make_appimage.sh
      - name: DMG
        if: startsWith(matrix.tag, 'macos')
        run: hdiutil create -volname "Neutron Migrator" -srcfolder "dist/Neutron Migrator.app" -ov -format UDZO "dist/NeutronMigrator-${{ matrix.tag }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: NeutronMigrator-${{ matrix.tag }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg

  legacy-linux:
    runs-on: ubuntu-latest
    container: almalinux:8
    continue-on-error: true
    steps:
      - name: Install toolchain
        run: |
          dnf -y install python3.12 python3.12-pip binutils git findutils which
          python3.12 -V
      - uses: actions/checkout@v7
      - name: Build for glibc 2.28+
        shell: bash
        run: |
          set -euxo pipefail
          python3.12 -m pip install -U pip
          python3.12 -m pip install "PySide6==6.8.3" requests platformdirs "pyinstaller>=6.10"
          python3.12 scripts/fetch_proton_cli.py --target linux-x64
          python3.12 scripts/build.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NeutronMigrator-linux-x64-legacy
          path: dist/*.tar.gz
          if-no-files-found: warn

  release:
    needs: [build, legacy-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true