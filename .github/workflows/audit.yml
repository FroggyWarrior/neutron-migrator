name: security-audit

on:
  schedule:
    - cron: "0 6 * * 1"     # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pip-audit
      - run: pip-audit -r requirements.txt